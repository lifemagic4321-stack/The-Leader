<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Leader - استوديو الفلاتر</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
    h1 { font-size: 1.5rem; margin-bottom: 15px; color: #38bdf8; }
    .card { background: #1e293b; padding: 20px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; }
    .upload-btn { display: inline-block; background: #0284c7; color: #fff; padding: 14px 24px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
    .upload-btn:active { transform: scale(0.98); }
    input[type="file"] { display: none; }
    canvas { max-width: 100%; border-radius: 12px; margin-top: 15px; display: none; border: 2px solid #334155; }
    .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; display: none; }
    .filter-btn { background: #334155; color: #fff; border: none; padding: 10px 6px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
    .filter-btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
    .download-btn { background: #16a34a; color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; display: none; }
  </style>
</head>
<body>
  <h1>✨ The Leader - الفلاتر الذكية</h1>
  <div class="card">
    <label class="upload-btn">
      📁 اختر صورة من المعرض
      <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">
    </label>
    <canvas id="canvas"></canvas>
    <div class="filters" id="filtersBox">
      <button class="filter-btn active" onclick="applyFilter('none', this)">أصلي</button>
      <button class="filter-btn" onclick="applyFilter('contrast(120%) saturate(130%) brightness(105%)', this)">ألوان زاهية</button>
      <button class="filter-btn" onclick="applyFilter('contrast(135%) brightness(95%) sepia(20%)', this)">سينمائي</button>
      <button class="filter-btn" onclick="applyFilter('grayscale(100%) contrast(120%)', this)">أبيض وأسود</button>
      <button class="filter-btn" onclick="applyFilter('sepia(45%) brightness(108%)', this)">دافئ كلاسيك</button>
      <button class="filter-btn" onclick="applyFilter('brightness(115%) contrast(108%) saturate(110%)', this)">تفتيح وصفاء</button>
    </div>
    <button class="download-btn" id="downloadBtn" onclick="downloadImage()">⬇️ حفظ الصورة بالفلتر</button>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const filtersBox = document.getElementById('filtersBox');
    const downloadBtn = document.getElementById('downloadBtn');
    let img = new Image();

    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.filter = 'none';
          ctx.drawImage(img, 0, 0);
          canvas.style.display = 'block';
          filtersBox.style.display = 'grid';
          downloadBtn.style.display = 'block';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function applyFilter(filterValue, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.filter = filterValue;
      ctx.drawImage(img, 0, 0);
    }

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'The-Leader-Filtered.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
